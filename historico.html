<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico — Megas Express</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--line:#262d3a;
    --green:#2ecc71;--red:#e74c3c;--amber:#f5a623;
    --text:#e8ecf1;--sub:#8b96a5;--accent:#3ddc84;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);font-family:'Segoe UI',Roboto,-apple-system,sans-serif;
    color:var(--text);min-height:100vh;display:flex;justify-content:center;
    padding:24px 14px 30px;
  }
  .wrap{width:100%;max-width:420px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .topbar h1{font-size:18px;font-weight:600;}
  .topbar .tag{font-size:11px;color:var(--sub);}

  .nav{display:flex;gap:6px;margin-bottom:16px;}
  .nav a{
    flex:1;text-align:center;font-size:11px;color:var(--sub);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 2px;text-decoration:none;
  }
  .nav a.active{color:var(--accent);border-color:var(--accent);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .who{font-weight:600;}
  .list-item .when{color:var(--sub);font-size:11px;margin-top:1px;}
  .list-item .val{color:var(--green);font-weight:600;white-space:nowrap;}
  .list-item .val.falha{color:var(--red);}
  .empty{color:var(--sub);font-size:12px;text-align:center;padding:16px 0;}

  .refresh-note{font-size:10px;color:var(--sub);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1>Histórico de Vendas</h1>
    <span class="tag">Últimas 50</span>
  </div>

  <div class="nav">
    <a href="/index.html">Painel</a>
    <a href="/telefones.html">Telefones</a>
    <a href="/configuracoes.html">Config</a>
    <a href="/historico.html" class="active">Histórico</a>
  </div>

  <div class="card">
    <div id="listHistorico"><div class="empty">carregando…</div></div>
  </div>

  <div class="refresh-note">Atualiza a cada 15s</div>
</div>

<script>
const API_BASE = "";

async function carregarHistorico(){
  const container = document.getElementById('listHistorico');
  try {
    const res = await fetch(`${API_BASE}/api/historico`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const itens = await res.json();
    if (!itens || itens.length === 0){
      container.innerHTML = '<div class="empty">Nenhum registro ainda</div>';
      return;
    }
    container.innerHTML = itens.map(ev => `
      <div class="list-item">
        <div>
          <div class="who">${ev.nome ?? '—'}</div>
          <div class="when">${ev.data ?? ''} · ${ev.hora ?? '—'}</div>
        </div>
        <div class="val ${String(ev.valor).includes('Falha') ? 'falha' : ''}">${ev.valor ?? '—'}</div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div class="empty">Erro: ${String(e.message || e)}</div>`;
  }
}

carregarHistorico();
setInterval(carregarHistorico, 15000);
</script>

</body>
</html>
